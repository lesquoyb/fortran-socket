name: Generate Constants

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/constants.txt'
      - 'tools/constant_generator.py'
      - 'tools/constant.template.c'
      - 'tools/constants.template.f90'

jobs:
  generate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run constant generator
        run: python tools/constant_generator.py

      - name: Upload generated constants
        uses: actions/upload-artifact@v4
        with:
          name: constants-${{ matrix.platform }}
          path: tools/generated_constants.f90

  merge:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Merge platform constants into constants.f90
        run: |
          python tools/merge_constants.py \
            artifacts/constants-windows/generated_constants.f90 \
            artifacts/constants-linux/generated_constants.f90 \
            artifacts/constants-macos/generated_constants.f90 \
            src/constants.f90

      - name: Commit updated constants.f90
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/constants.f90
          if git diff --cached --quiet; then
            echo "No changes to constants.f90"
          else
            git commit -m "chore: regenerate constants.f90 for all platforms"
            git push
          fi
